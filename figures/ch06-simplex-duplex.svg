<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif">

  <!-- ===== panel divider ===== -->
  <line x1="380" y1="16" x2="380" y2="424" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6" fill="none"/>

  <!-- ================= PANEL A : SIMPLEX ================= -->
  <g fill="currentColor" stroke="none">
    <text x="190" y="34" text-anchor="middle" font-size="16" font-weight="bold">SIMPLEX</text>
    <text x="190" y="52" text-anchor="middle" font-size="11">one frequency — no machine in the middle</text>
  </g>

  <!-- Radio A -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="66" y="230" width="28" height="48" rx="5"/>
    <line x1="80" y1="230" x2="80" y2="212" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="74" y1="244" x2="86" y2="244" stroke-width="1.5"/>
    <line x1="74" y1="250" x2="86" y2="250" stroke-width="1.5"/>
  </g>
  <text x="80" y="296" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">Radio A</text>

  <!-- Radio B -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="286" y="230" width="28" height="48" rx="5"/>
    <line x1="300" y1="230" x2="300" y2="212" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="294" y1="244" x2="306" y2="244" stroke-width="1.5"/>
    <line x1="294" y1="250" x2="306" y2="250" stroke-width="1.5"/>
  </g>
  <text x="300" y="296" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">Radio B</text>

  <!-- one frequency, both ways -->
  <line x1="104" y1="254" x2="276" y2="254" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <polygon points="104,254 116,249 116,259" fill="currentColor" stroke="none"/>
  <polygon points="276,254 264,249 264,259" fill="currentColor" stroke="none"/>
  <g fill="currentColor" stroke="none">
    <text x="190" y="240" text-anchor="middle" font-size="12.5" font-weight="bold">146.520 MHz</text>
    <text x="190" y="272" text-anchor="middle" font-size="10.5">both transmit and receive here</text>
    <text x="190" y="330" text-anchor="middle" font-size="10.5">146.520 MHz — the 2 m national FM simplex calling frequency</text>
    <text x="190" y="350" text-anchor="middle" font-size="10.5" font-style="italic">stations in direct range can talk without tying up a repeater</text>
  </g>

  <!-- ================= PANEL B : THROUGH A REPEATER ================= -->
  <g fill="currentColor" stroke="none">
    <text x="570" y="34" text-anchor="middle" font-size="16" font-weight="bold">THROUGH A REPEATER</text>
    <text x="570" y="52" text-anchor="middle" font-size="11">half-duplex — two frequencies, one at a time</text>
    <text x="570" y="88" text-anchor="middle" font-size="12.5" font-weight="bold">REPEATER</text>
  </g>

  <!-- repeater tower -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="570" y1="196" x2="570" y2="116"/>
    <line x1="570" y1="116" x2="555" y2="102"/>
    <line x1="570" y1="116" x2="570" y2="96"/>
    <line x1="570" y1="116" x2="585" y2="102"/>
  </g>
  <line x1="556" y1="196" x2="584" y2="196" stroke="currentColor" stroke-width="2" fill="none"/>

  <!-- Radio A -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="436" y="280" width="28" height="48" rx="5"/>
    <line x1="450" y1="280" x2="450" y2="262" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="444" y1="294" x2="456" y2="294" stroke-width="1.5"/>
    <line x1="444" y1="300" x2="456" y2="300" stroke-width="1.5"/>
  </g>
  <text x="450" y="346" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">Radio A</text>

  <!-- Radio B -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="676" y="280" width="28" height="48" rx="5"/>
    <line x1="690" y1="280" x2="690" y2="262" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="684" y1="294" x2="696" y2="294" stroke-width="1.5"/>
    <line x1="684" y1="300" x2="696" y2="300" stroke-width="1.5"/>
  </g>
  <text x="690" y="346" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">Radio B</text>

  <!-- 1 : A -> repeater input -->
  <line x1="458" y1="256" x2="550" y2="138" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <polygon points="550,138 546.6,150.6 538.7,144.4" fill="currentColor" stroke="none"/>
  <circle cx="493" cy="188" r="11" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="493" y="192.5" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor" stroke="none">1</text>

  <!-- 2 : repeater output -> B -->
  <line x1="590" y1="138" x2="682" y2="258" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <polygon points="682,258 670.7,251.5 678.7,245.5" fill="currentColor" stroke="none"/>
  <circle cx="647" cy="189" r="11" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="647" y="193.5" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor" stroke="none">2</text>

  <!-- legend -->
  <g fill="currentColor" stroke="none" font-size="10.5">
    <text x="408" y="368">1 — A transmits on the repeater's input: 146.340 MHz</text>
    <text x="408" y="386">2 — the repeater retransmits on its output: 146.940 MHz</text>
    <text x="408" y="404" font-style="italic">B listens on the output — to reply, B transmits on the input</text>
  </g>
</svg>
