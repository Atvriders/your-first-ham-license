<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="34" font-size="18" font-weight="bold">INTERNET LINKING — EchoLink &amp; IRLP</text>
    <text x="380" y="56" font-size="12.5">your HT reaches the world: RF to a node, voice over the internet (VoIP), back out on RF far away</text>
  </g>

  <!-- ===== 1. You: HT (left) ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <rect x="52" y="268" width="46" height="86" rx="8"/>
    <rect x="60" y="280" width="30" height="20" rx="2"/>
    <line x1="75" y1="268" x2="75" y2="222"/>
    <circle cx="75" cy="218" r="2.5" fill="currentColor" stroke="none"/>
    <path d="M87,232 q10,8 0,22"/>
    <path d="M63,232 q-10,8 0,22"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="75" y="376" font-size="13" font-weight="bold">YOU + YOUR HT</text>
    <text x="75" y="392" font-size="10">ordinary 2 m / 70 cm radio</text>
  </g>

  <!-- ===== 2. Local repeater / node ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M215,340 Q270,184 325,340 Z"/>
    <line x1="270" y1="262" x2="270" y2="182"/>
    <line x1="254" y1="188" x2="286" y2="188"/>
    <line x1="257" y1="201" x2="283" y2="201"/>
    <line x1="260" y1="214" x2="280" y2="214"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="270" y="168" font-size="13" font-weight="bold">LOCAL REPEATER</text>
    <text x="270" y="356" font-size="10">with an EchoLink / IRLP</text>
    <text x="270" y="369" font-size="10">node connected to it</text>
  </g>

  <!-- ===== 3. Internet cloud ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M350,150
             a26,22 0 0 1 24,-30
             a30,26 0 0 1 52,-12
             a26,22 0 0 1 34,24
             a22,18 0 0 1 -8,42
             l-92,0
             a20,17 0 0 1 -10,-24 Z"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="408" y="144" font-size="12" font-weight="bold">INTERNET</text>
    <text x="408" y="159" font-size="9.5">voice as data (VoIP)</text>
  </g>

  <!-- ===== 4. Remote repeater ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M505,340 Q560,184 615,340 Z"/>
    <line x1="560" y1="262" x2="560" y2="182"/>
    <line x1="544" y1="188" x2="576" y2="188"/>
    <line x1="547" y1="201" x2="573" y2="201"/>
    <line x1="550" y1="214" x2="570" y2="214"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="560" y="168" font-size="13" font-weight="bold">REMOTE REPEATER</text>
    <text x="560" y="356" font-size="10">another node, hundreds</text>
    <text x="560" y="369" font-size="10">or thousands of miles away</text>
  </g>

  <!-- ===== 5. Far-away ham (right) ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <rect x="660" y="268" width="46" height="86" rx="8"/>
    <rect x="668" y="280" width="30" height="20" rx="2"/>
    <line x1="683" y1="268" x2="683" y2="222"/>
    <circle cx="683" cy="218" r="2.5" fill="currentColor" stroke="none"/>
    <path d="M695,232 q10,8 0,22"/>
    <path d="M671,232 q-10,8 0,22"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="683" y="376" font-size="13" font-weight="bold">A FAR-AWAY HAM</text>
    <text x="683" y="392" font-size="10">hears you on their repeater</text>
  </g>

  <!-- ===== links ===== -->
  <!-- RF: HT -> local repeater -->
  <g stroke="currentColor" fill="none" stroke-width="1.8" stroke-dasharray="7,5" stroke-linecap="round">
    <line x1="105" y1="250" x2="218" y2="222"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M224,221 l-12,-1 l6,10 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="162" y="222" transform="rotate(-11 162 222)">1 &#183; your voice on RF</text>
  </g>

  <!-- node -> internet -->
  <g stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round">
    <line x1="305" y1="290" x2="352" y2="182"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M354,176 l-9,-7 l-1,12 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="310" y="228" transform="rotate(-66 310 228)">2 &#183; onto the internet</text>
  </g>

  <!-- internet -> remote node -->
  <g stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round">
    <line x1="452" y1="182" x2="514" y2="286"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M517,292 l-8,-9 l11,2 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="508" y="230" transform="rotate(60 508 230)">3 &#183; out a remote node</text>
  </g>

  <!-- RF: remote repeater -> far ham -->
  <g stroke="currentColor" fill="none" stroke-width="1.8" stroke-dasharray="7,5" stroke-linecap="round">
    <line x1="588" y1="224" x2="652" y2="248"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M658,250 l-11,-4 l4,11 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="628" y="224" transform="rotate(12 628 224)">4 &#183; RF again</text>
  </g>

  <!-- ===== bottom notes ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11.5" font-style="italic">
    <text x="380" y="414">IRLP: you bring up the link with DTMF tones from your radio — announce yourself, and leave extra pauses for the delay.</text>
    <text x="380" y="432">EchoLink also runs as a computer or phone app — but first you register your call sign and provide proof of license.</text>
  </g>

</svg>
