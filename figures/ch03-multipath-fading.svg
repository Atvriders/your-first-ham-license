<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="sans-serif">

  <!-- ===== Ground with hatching ===== -->
  <line x1="30" y1="260" x2="730" y2="260" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="50" y1="260" x2="41" y2="271"/>
    <line x1="90" y1="260" x2="81" y2="271"/>
    <line x1="130" y1="260" x2="121" y2="271"/>
    <line x1="170" y1="260" x2="161" y2="271"/>
    <line x1="210" y1="260" x2="201" y2="271"/>
    <line x1="250" y1="260" x2="241" y2="271"/>
    <line x1="290" y1="260" x2="281" y2="271"/>
    <line x1="330" y1="260" x2="321" y2="271"/>
    <line x1="370" y1="260" x2="361" y2="271"/>
    <line x1="410" y1="260" x2="401" y2="271"/>
    <line x1="450" y1="260" x2="441" y2="271"/>
    <line x1="490" y1="260" x2="481" y2="271"/>
    <line x1="530" y1="260" x2="521" y2="271"/>
    <line x1="570" y1="260" x2="561" y2="271"/>
    <line x1="610" y1="260" x2="601" y2="271"/>
    <line x1="650" y1="260" x2="641" y2="271"/>
    <line x1="690" y1="260" x2="681" y2="271"/>
  </g>

  <!-- ===== TX tower ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="90" y1="260" x2="90" y2="170"/>
    <line x1="90" y1="170" x2="76" y2="156"/>
    <line x1="90" y1="170" x2="90" y2="148"/>
    <line x1="90" y1="170" x2="104" y2="156"/>
  </g>

  <!-- ===== Building (reflector; set back from the direct path) ===== -->
  <rect x="330" y="50" width="85" height="115" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="342" y="70" width="13" height="16"/>
    <rect x="366" y="70" width="13" height="16"/>
    <rect x="390" y="70" width="13" height="16"/>
    <rect x="342" y="95" width="13" height="16"/>
    <rect x="366" y="95" width="13" height="16"/>
    <rect x="390" y="95" width="13" height="16"/>
    <rect x="342" y="120" width="13" height="16"/>
    <rect x="366" y="120" width="13" height="16"/>
    <rect x="390" y="120" width="13" height="16"/>
  </g>

  <!-- ===== Mobile car receiver ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <rect x="566" y="236" width="100" height="22" rx="6"/>
    <path d="M 584,236 L 592,220 L 630,220 L 640,236"/>
    <line x1="616" y1="220" x2="616" y2="196"/>
  </g>
  <circle cx="586" cy="260" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="644" cy="260" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- ===== Path 1: direct ===== -->
  <line x1="98" y1="176" x2="612" y2="200" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <path d="M 612,200 L 601.8,204 L 602.2,195 Z" fill="currentColor" stroke="none"/>

  <!-- ===== Path 2: one bounce off the building ===== -->
  <path d="M 98,176 L 330,165 L 612,200" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7,5"/>
  <circle cx="330" cy="165" r="3.5" fill="currentColor" stroke="none"/>
  <path d="M 214,170.5 L 204.2,175.5 L 203.8,166.5 Z" fill="currentColor" stroke="none"/>
  <path d="M 471,182.5 L 460.5,185.8 L 461.7,176.8 Z" fill="currentColor" stroke="none"/>

  <!-- ===== Divider ===== -->
  <line x1="40" y1="315" x2="720" y2="315" stroke="currentColor" stroke-width="1.2" opacity="0.35" fill="none"/>

  <!-- ===== In-phase combination (left panel) ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <polyline points="120,368 130,360.9 140,358 150,360.9 160,368 170,375.1 180,378 190,375.1 200,368 210,360.9 220,358 230,360.9 240,368 250,375.1 260,378 270,375.1 280,368"/>
    <polyline points="120,400 130,392.9 140,390 150,392.9 160,400 170,407.1 180,410 190,407.1 200,400 210,392.9 220,390 230,392.9 240,400 250,407.1 260,410 270,407.1 280,400"/>
  </g>
  <polyline points="120,455 130,440.9 140,435 150,440.9 160,455 170,469.1 180,475 190,469.1 200,455 210,440.9 220,435 230,440.9 240,455 250,469.1 260,475 270,469.1 280,455"
            fill="none" stroke="currentColor" stroke-width="2.6"/>

  <!-- ===== Out-of-phase combination (right panel) ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <polyline points="440,368 450,360.9 460,358 470,360.9 480,368 490,375.1 500,378 510,375.1 520,368 530,360.9 540,358 550,360.9 560,368 570,375.1 580,378 590,375.1 600,368"/>
    <polyline points="440,400 450,407.1 460,410 470,407.1 480,400 490,392.9 500,390 510,392.9 520,400 530,407.1 540,410 550,407.1 560,400 570,392.9 580,390 590,392.9 600,400"/>
  </g>
  <line x1="440" y1="455" x2="600" y2="455" stroke="currentColor" stroke-width="2.6" fill="none"/>

  <!-- ===== Picket fence glyph (namesake of the flutter) ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
    <line x1="688" y1="474" x2="748" y2="474"/>
    <line x1="688" y1="488" x2="748" y2="488"/>
    <path d="M 692,496 L 692,470 L 694.5,464 L 697,470 L 697,496"/>
    <path d="M 703,496 L 703,470 L 705.5,464 L 708,470 L 708,496"/>
    <path d="M 714,496 L 714,470 L 716.5,464 L 719,470 L 719,496"/>
    <path d="M 725,496 L 725,470 L 727.5,464 L 730,470 L 730,496"/>
    <path d="M 736,496 L 736,470 L 738.5,464 L 741,470 L 741,496"/>
  </g>

  <!-- ===== Labels ===== -->
  <g fill="currentColor" stroke="none">
    <text x="90" y="136" text-anchor="middle" font-size="13" font-weight="bold">TX</text>
    <text x="372" y="38" text-anchor="middle" font-size="11.5">building</text>
    <text x="616" y="288" text-anchor="middle" font-size="12">mobile RX</text>
    <text x="205" y="205" text-anchor="middle" font-size="12">path 1 (direct)</text>
    <text x="490" y="130" text-anchor="middle" font-size="12">path 2 (reflected)</text>

    <text x="200" y="338" text-anchor="middle" font-size="13" font-weight="bold">in phase: signals add</text>
    <text x="560" y="338" text-anchor="middle" font-size="13" font-weight="bold">out of phase: signals cancel</text>

    <text x="112" y="379" text-anchor="end" font-size="10">direct</text>
    <text x="112" y="409" text-anchor="end" font-size="10">reflected</text>
    <text x="108" y="459" text-anchor="end" font-size="13">=</text>
    <text x="432" y="379" text-anchor="end" font-size="10">direct</text>
    <text x="432" y="409" text-anchor="end" font-size="10">reflected</text>
    <text x="428" y="459" text-anchor="end" font-size="13">=</text>
    <text x="295" y="459" font-size="12.5" font-weight="bold">strong</text>
    <text x="615" y="459" font-size="12.5" font-weight="bold">weak</text>

    <text x="380" y="488" text-anchor="middle" font-size="12.5">As the car moves a few feet, the mix flips between strong and weak — the rapid flutter is “picket fencing”.</text>
  </g>
</svg>
