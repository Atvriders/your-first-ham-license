<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="34" font-size="18" font-weight="bold">A BASIC BEGINNER STATION</text>
    <text x="380" y="55" font-size="12.5">power in, audio in, RF out — what plugs into what</text>
  </g>

  <!-- ===== RF chain: transceiver -> SWR meter -> feed line -> antenna ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <rect x="250" y="150" width="180" height="90"/>
    <rect x="500" y="155" width="140" height="80"/>
    <!-- RF jumper, transceiver to meter -->
    <line x1="430" y1="195" x2="494" y2="195"/>
    <!-- coax feed line, meter to antenna -->
    <line x1="640" y1="195" x2="710" y2="195"/>
    <!-- antenna whip at the end of the feed line -->
    <line x1="720" y1="195" x2="720" y2="92"/>
    <line x1="708" y1="102" x2="732" y2="102"/>
    <line x1="711" y1="115" x2="729" y2="115"/>
    <line x1="714" y1="128" x2="726" y2="128"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="498,195 488,190 488,200"/>
    <polygon points="714,195 704,190 704,200"/>
    <circle cx="720" cy="195" r="3.4"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="340" y="188" font-size="15" font-weight="bold">TRANSCEIVER</text>
    <text x="340" y="206" font-size="10.5">transmitter + receiver in one</text>
    <text x="570" y="184" font-size="13.5" font-weight="bold">SWR METER</text>
    <text x="570" y="201" font-size="9.5">reads forward +</text>
    <text x="570" y="214" font-size="9.5">reflected power</text>
    <text x="465" y="186" font-size="10.5">RF</text>
    <text x="675" y="183" font-size="10.5">coax feed line</text>
    <text x="720" y="80" font-size="12.5" font-weight="bold">ANTENNA</text>
  </g>

  <!-- ===== microphone + key into the transceiver ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <rect x="40" y="140" width="140" height="52"/>
    <rect x="40" y="210" width="140" height="48"/>
    <line x1="180" y1="166" x2="244" y2="166"/>
    <line x1="180" y1="234" x2="244" y2="234"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="250,166 240,161 240,171"/>
    <polygon points="250,234 240,229 240,239"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="110" y="162" font-size="12.5" font-weight="bold">MICROPHONE</text>
    <text x="110" y="177" font-size="9.5">voice + push-to-talk (PTT)</text>
    <text x="110" y="232" font-size="12.5" font-weight="bold">MORSE KEY</text>
    <text x="110" y="247" font-size="9.5">(or paddle + keyer)</text>
    <text x="215" y="158" font-size="10">audio + PTT</text>
    <text x="215" y="226" font-size="10">keying</text>
  </g>

  <!-- ===== power: AC mains -> DC supply -> transceiver ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <rect x="40" y="300" width="140" height="60"/>
    <rect x="250" y="300" width="180" height="60"/>
    <line x1="180" y1="330" x2="244" y2="330"/>
    <line x1="340" y1="300" x2="340" y2="250"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="250,330 240,325 240,335"/>
    <polygon points="340,246 334,258 346,258"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="110" y="328" font-size="12.5" font-weight="bold">AC MAINS</text>
    <text x="110" y="343" font-size="9.5">120 V wall outlet</text>
    <text x="340" y="328" font-size="13" font-weight="bold">DC POWER SUPPLY</text>
    <text x="340" y="344" font-size="9.5">13.8 V — 12 A for a 50 W radio</text>
    <text x="215" y="322" font-size="10">120 V AC</text>
  </g>
  <text x="352" y="276" font-size="10.5" fill="currentColor" stroke="none">13.8 V DC</text>

  <!-- ===== bottom note ===== -->
  <text x="380" y="414" font-size="11.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">RF flows out to the antenna on transmit — and back in on receive; the SWR meter sits inline in the feed line.</text>

</svg>
