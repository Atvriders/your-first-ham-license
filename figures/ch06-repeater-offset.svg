<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" font-family="sans-serif">

  <!-- ===== the repeater ===== -->
  <text x="360" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor" stroke="none">a 2 m repeater</text>
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="360" y1="150" x2="360" y2="80"/>
    <line x1="360" y1="80" x2="346" y2="66"/>
    <line x1="360" y1="80" x2="360" y2="60"/>
    <line x1="360" y1="80" x2="374" y2="66"/>
  </g>

  <!-- ===== input tag (where the repeater listens) ===== -->
  <rect x="50" y="100" width="220" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" stroke="none">
    <text x="160" y="119" text-anchor="middle" font-size="10.5">its receiver listens — the INPUT</text>
    <text x="160" y="137" text-anchor="middle" font-size="13" font-weight="bold">146.340 MHz</text>
  </g>
  <line x1="270" y1="124" x2="352" y2="124" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <polygon points="352,124 342,119 342,129" fill="currentColor" stroke="none"/>

  <!-- ===== output tag (where the repeater transmits) ===== -->
  <rect x="450" y="100" width="220" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" stroke="none">
    <text x="560" y="119" text-anchor="middle" font-size="10.5">its transmitter sends — the OUTPUT</text>
    <text x="560" y="137" text-anchor="middle" font-size="13" font-weight="bold">146.940 MHz</text>
  </g>
  <line x1="368" y1="124" x2="450" y2="124" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <polygon points="450,124 438,119 438,129" fill="currentColor" stroke="none"/>

  <!-- ===== your radio : tune to the output to listen ===== -->
  <line x1="250" y1="205" x2="170" y2="148" stroke="currentColor" stroke-width="2" fill="none"/>
  <polygon points="170,148 182.7,150.9 176.9,159.1" fill="currentColor" stroke="none"/>
  <line x1="550" y1="148" x2="470" y2="205" stroke="currentColor" stroke-width="2" fill="none"/>
  <polygon points="470,205 476.9,193.9 482.7,202.1" fill="currentColor" stroke="none"/>
  <rect x="210" y="205" width="300" height="86" rx="8" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <g fill="currentColor" stroke="none">
    <text x="360" y="227" text-anchor="middle" font-size="13" font-weight="bold">YOUR RADIO</text>
    <text x="360" y="250" text-anchor="middle" font-size="11.5" font-weight="bold">to LISTEN, tune to the output: 146.940 MHz</text>
    <text x="360" y="272" text-anchor="middle" font-size="11">your radio TRANSMITS on the input: 146.340 MHz</text>
  </g>

  <!-- ===== the offset, on a frequency axis ===== -->
  <line x1="160" y1="318" x2="560" y2="318" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <line x1="160" y1="312" x2="160" y2="324" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <line x1="560" y1="312" x2="560" y2="324" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <text x="360" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor" stroke="none">a common −600 kHz offset on 2 m</text>

  <line x1="120" y1="340" x2="620" y2="340" stroke="currentColor" stroke-width="2" fill="none"/>
  <polygon points="620,340 608,335 608,345" fill="currentColor" stroke="none"/>
  <text x="634" y="344" font-size="11" font-style="italic" fill="currentColor" stroke="none">f</text>
  <line x1="160" y1="332" x2="160" y2="348" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="560" y1="332" x2="560" y2="348" stroke="currentColor" stroke-width="2" fill="none"/>
  <g fill="currentColor" stroke="none">
    <text x="160" y="366" text-anchor="middle" font-size="12" font-weight="bold">146.340</text>
    <text x="160" y="380" text-anchor="middle" font-size="10">the input</text>
    <text x="560" y="366" text-anchor="middle" font-size="12" font-weight="bold">146.940</text>
    <text x="560" y="380" text-anchor="middle" font-size="10">the output</text>
  </g>

  <!-- ===== notes ===== -->
  <g fill="currentColor" stroke="none" font-size="10.5" font-style="italic">
    <text x="360" y="408" text-anchor="middle">the offset is the difference between the repeater's transmit and receive frequencies</text>
    <text x="360" y="426" text-anchor="middle">community custom, not an FCC rule — odd splits exist near the band edges</text>
  </g>
</svg>
