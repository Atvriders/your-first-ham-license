<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">

  <!-- left axis: privileges increase upward -->
  <line x1="36" y1="358" x2="36" y2="66" stroke="currentColor" stroke-width="2"/>
  <polygon points="36,54 30,68 42,68" fill="currentColor"/>
  <text x="18" y="206" font-size="11.5" fill="currentColor" text-anchor="middle" transform="rotate(-90 18 206)">more privileges</text>

  <!-- ============ step 1: Technician ============ -->
  <rect x="70" y="270" width="210" height="100" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="175" y="297" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">TECHNICIAN</text>
  <text x="175" y="315" font-size="10.5" fill="currentColor" text-anchor="middle">Element 2 exam</text>
  <text x="175" y="332" font-size="10.5" fill="currentColor" text-anchor="middle">all frequencies above 30 MHz</text>
  <text x="175" y="347" font-size="10.5" fill="currentColor" text-anchor="middle">plus limited HF privileges</text>

  <!-- ============ step 2: General ============ -->
  <rect x="290" y="185" width="210" height="185" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="395" y="212" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">GENERAL</text>
  <text x="395" y="230" font-size="10.5" fill="currentColor" text-anchor="middle">Elements 2 + 3</text>
  <text x="395" y="247" font-size="10.5" fill="currentColor" text-anchor="middle">adds privileges on all</text>
  <text x="395" y="262" font-size="10.5" fill="currentColor" text-anchor="middle">bands and modes</text>

  <!-- ============ step 3: Amateur Extra ============ -->
  <rect x="510" y="100" width="210" height="270" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="615" y="127" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">AMATEUR EXTRA</text>
  <text x="615" y="145" font-size="10.5" fill="currentColor" text-anchor="middle">Elements 2 + 3 + 4</text>
  <text x="615" y="162" font-size="10.5" fill="currentColor" text-anchor="middle">all available US</text>
  <text x="615" y="177" font-size="10.5" fill="currentColor" text-anchor="middle">amateur privileges</text>

  <!-- baseline -->
  <line x1="60" y1="370" x2="730" y2="370" stroke="currentColor" stroke-width="2"/>
</svg>
