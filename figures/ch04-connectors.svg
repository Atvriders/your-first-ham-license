<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 505" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Titles ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="360" y="30" font-size="17" font-weight="bold">CONNECTORS &amp; COAX</text>
    <text x="360" y="52" font-size="12.5">three plugs every Technician meets — and what is inside the cable</text>
  </g>

  <!-- ===== PL-259 (the "UHF" plug) ===== -->
  <g stroke="currentColor" fill="none" stroke-linecap="round">
    <!-- cable -->
    <line x1="30" y1="125" x2="72" y2="125" stroke-width="13"/>
    <!-- rear barrel -->
    <rect x="72" y="110" width="18" height="30" stroke-width="1.6" fill="currentColor" fill-opacity="0.08"/>
    <!-- knurled coupling ring -->
    <rect x="90" y="98" width="60" height="54" stroke-width="1.8" fill="currentColor" fill-opacity="0.12"/>
    <g stroke-width="1" opacity="0.7">
      <line x1="98" y1="100" x2="98" y2="150"/>
      <line x1="106" y1="100" x2="106" y2="150"/>
      <line x1="114" y1="100" x2="114" y2="150"/>
      <line x1="122" y1="100" x2="122" y2="150"/>
      <line x1="130" y1="100" x2="130" y2="150"/>
      <line x1="138" y1="100" x2="138" y2="150"/>
      <line x1="146" y1="100" x2="146" y2="150"/>
    </g>
    <!-- front shell + center pin -->
    <rect x="150" y="112" width="22" height="26" stroke-width="1.6"/>
    <line x1="172" y1="125" x2="196" y2="125" stroke-width="4"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="130" y="196" font-size="12.5" font-weight="bold">PL-259 — the “UHF” plug</text>
    <text x="130" y="213" font-size="11.5">the standard connector at HF and VHF —</text>
    <text x="130" y="227" font-size="11.5">but not watertight (T9B07)</text>
  </g>

  <!-- ===== BNC (bayonet) ===== -->
  <g stroke="currentColor" fill="none" stroke-linecap="round">
    <!-- cable -->
    <line x1="272" y1="125" x2="306" y2="125" stroke-width="11"/>
    <!-- rear barrel -->
    <rect x="306" y="112" width="16" height="26" stroke-width="1.6" fill="currentColor" fill-opacity="0.08"/>
    <!-- coupling ring with bayonet lugs -->
    <rect x="322" y="104" width="50" height="42" stroke-width="1.8" fill="currentColor" fill-opacity="0.12"/>
    <rect x="362" y="97" width="10" height="7" stroke-width="1.4" fill="currentColor" fill-opacity="0.35"/>
    <rect x="362" y="146" width="10" height="7" stroke-width="1.4" fill="currentColor" fill-opacity="0.35"/>
    <!-- front barrel + center pin -->
    <rect x="372" y="114" width="20" height="22" stroke-width="1.6"/>
    <line x1="392" y1="125" x2="414" y2="125" stroke-width="3.5"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="360" y="196" font-size="12.5" font-weight="bold">BNC — quarter-turn bayonet</text>
    <text x="360" y="213" font-size="11.5">push on and twist to lock; common on</text>
    <text x="360" y="227" font-size="11.5">handhelds and test gear</text>
  </g>

  <!-- ===== SMA (small screw-on) ===== -->
  <g stroke="currentColor" fill="none" stroke-linecap="round">
    <!-- cable -->
    <line x1="512" y1="125" x2="548" y2="125" stroke-width="8"/>
    <!-- rear barrel -->
    <rect x="548" y="115" width="12" height="20" stroke-width="1.5" fill="currentColor" fill-opacity="0.08"/>
    <!-- hex nut -->
    <polygon points="560,109 588,109 597,125 588,141 560,141 551,125" stroke-width="1.8" fill="currentColor" fill-opacity="0.12"/>
    <!-- threaded front + tiny pin -->
    <rect x="597" y="116" width="17" height="18" stroke-width="1.5"/>
    <g stroke-width="1" opacity="0.7">
      <line x1="601" y1="116" x2="601" y2="134"/>
      <line x1="606" y1="116" x2="606" y2="134"/>
      <line x1="611" y1="116" x2="611" y2="134"/>
    </g>
    <line x1="614" y1="125" x2="632" y2="125" stroke-width="2.5"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="590" y="196" font-size="12.5" font-weight="bold">SMA — small screw-on</text>
    <text x="590" y="213" font-size="11.5">the antenna connector on many</text>
    <text x="590" y="227" font-size="11.5">handheld radios</text>
  </g>

  <text x="360" y="256" font-size="12" fill="currentColor" stroke="none" text-anchor="middle">Whatever the plug: any outdoor connector should be carefully taped against the weather (T9B01).</text>

  <!-- ===== Coax cross-section ===== -->
  <text x="360" y="292" font-size="13.5" font-weight="bold" fill="currentColor" stroke="none" text-anchor="middle">INSIDE COAXIAL CABLE — 50 Ω IS THE AMATEUR STANDARD (T9B02)</text>

  <!-- layers, outer to inner -->
  <path d="M 190,325 a 70,70 0 1 0 0.01,0 Z M 190,335 a 60,60 0 1 1 -0.01,0 Z"
        fill="currentColor" fill-opacity="0.16" fill-rule="evenodd" stroke="none"/>
  <circle cx="190" cy="395" r="70" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="190" cy="395" r="60" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="190" cy="395" r="54" fill="none" stroke="currentColor" stroke-width="9"
          stroke-dasharray="3.5 2.6" opacity="0.75"/>
  <circle cx="190" cy="395" r="49" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.4"/>
  <circle cx="190" cy="395" r="11" fill="currentColor" stroke="none"/>

  <!-- leader lines to the layer labels -->
  <g stroke="currentColor" fill="none" stroke-width="1.1">
    <polyline points="199,391 282,332 296,332"/>
    <polyline points="228,364 284,374 296,374"/>
    <polyline points="234,426 284,416 296,416"/>
    <polyline points="222,451 282,458 296,458"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="12.5">
    <text x="302" y="336">center conductor — the signal’s path</text>
    <text x="302" y="378">dielectric — the insulating spacer</text>
    <text x="302" y="420">shield (braid) — the return conductor; keeps RF inside</text>
    <text x="302" y="462">jacket — UV-resistant; keeps water out (T7C09–T7C10)</text>
  </g>
  <text x="190" y="487" font-size="11.5" fill="currentColor" stroke="none" text-anchor="middle">coax, cut and viewed end-on</text>
</svg>
