<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="34" font-size="18" font-weight="bold">APRS: YOUR POSITION, ON THE MAP</text>
    <text x="380" y="56" font-size="12.5">beacon &#8594; digipeater &#8594; iGate &#8594; internet — one shared channel: <tspan font-weight="bold">144.390 MHz</tspan> FM packet (North America)</text>
  </g>

  <!-- ===== 1. Your tracker / HT (left) ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <rect x="58" y="268" width="46" height="86" rx="8"/>
    <rect x="66" y="280" width="30" height="20" rx="2"/>
    <line x1="81" y1="268" x2="81" y2="222"/>
    <circle cx="81" cy="218" r="2.5" fill="currentColor" stroke="none"/>
    <!-- radiated beacon ticks -->
    <path d="M93,232 q10,8 0,22"/>
    <path d="M69,232 q-10,8 0,22"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="81" y="376" font-size="13" font-weight="bold">YOUR TRACKER / HT</text>
    <text x="81" y="392" font-size="10">GPS position in, packet out</text>
    <text x="81" y="299" font-size="8.5">FN31</text>
  </g>

  <!-- ===== 2. Digipeater on a hill (center-left) ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235,340 Q300,184 365,340 Z"/>
    <line x1="300" y1="262" x2="300" y2="182"/>
    <line x1="284" y1="188" x2="316" y2="188"/>
    <line x1="287" y1="201" x2="313" y2="201"/>
    <line x1="290" y1="214" x2="310" y2="214"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="300" y="168" font-size="13" font-weight="bold">DIGIPEATER</text>
    <text x="300" y="356" font-size="10">hilltop relay — hears your packet,</text>
    <text x="300" y="369" font-size="10">retransmits it a moment later</text>
  </g>

  <!-- ===== 3. iGate (center-right) ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <line x1="490" y1="330" x2="490" y2="248"/>
    <line x1="478" y1="254" x2="502" y2="254"/>
    <line x1="481" y1="267" x2="499" y2="267"/>
    <line x1="484" y1="280" x2="496" y2="280"/>
    <rect x="450" y="330" width="80" height="34" rx="3"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="490" y="351" font-size="12" font-weight="bold">iGate</text>
    <text x="490" y="234" font-size="13" font-weight="bold">iGATE</text>
    <text x="490" y="386" font-size="10">a receiver with an internet</text>
    <text x="490" y="399" font-size="10">connection — a gateway</text>
  </g>

  <!-- ===== 4. Internet cloud + map display (right) ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M600,150
             a26,22 0 0 1 24,-30
             a30,26 0 0 1 52,-12
             a26,22 0 0 1 34,24
             a22,18 0 0 1 -8,42
             l-92,0
             a20,17 0 0 1 -10,-24 Z"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="658" y="144" font-size="12" font-weight="bold">INTERNET</text>
    <text x="658" y="159" font-size="9.5">(APRS-IS)</text>
  </g>
  <!-- phone/map display -->
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <rect x="618" y="300" width="82" height="58" rx="6"/>
    <path d="M628,344 q14,-18 26,-8 q10,8 18,-4 q6,-10 18,-6"/>
    <circle cx="654" cy="330" r="4" fill="currentColor" stroke="none"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="659" y="380" font-size="12.5" font-weight="bold">aprs.fi &amp; friends</text>
    <text x="659" y="395" font-size="10">your dot, moving on a map</text>
  </g>

  <!-- ===== links ===== -->
  <!-- RF: HT -> digipeater -->
  <g stroke="currentColor" fill="none" stroke-width="1.8" stroke-dasharray="7,5" stroke-linecap="round">
    <line x1="104" y1="252" x2="252" y2="212"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M258,211 l-12,-1 l6,10 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="180" y="212" transform="rotate(-11 180 212)">1 &#183; beacon! 144.390 MHz</text>
  </g>

  <!-- RF: digipeater -> iGate -->
  <g stroke="currentColor" fill="none" stroke-width="1.8" stroke-dasharray="7,5" stroke-linecap="round">
    <line x1="322" y1="208" x2="452" y2="246"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M458,248 l-11,-4 l4,11 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="392" y="208" transform="rotate(14 392 208)">2 &#183; relayed packet</text>
  </g>

  <!-- wired: iGate -> internet -->
  <g stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round">
    <line x1="530" y1="310" x2="600" y2="178"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M603,172 l-10,-5 l1,12 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="585" y="258" transform="rotate(-66 585 258)">3 &#183; into the internet</text>
  </g>

  <!-- internet -> map display -->
  <g stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round">
    <line x1="640" y1="182" x2="655" y2="294"/>
  </g>
  <g fill="currentColor" stroke="none">
    <path d="M656,300 l-6,-10 l10,4 z"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="636" y="246" transform="rotate(-81 636 246)">4 &#183; everywhere</text>
  </g>

  <!-- ===== bottom note ===== -->
  <text x="380" y="428" font-size="11.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">The same channel also carries short text messages and weather — it's shared, so beacon at a sensible rate.</text>

</svg>
