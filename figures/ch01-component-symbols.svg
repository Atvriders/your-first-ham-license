<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 400" font-family="sans-serif">

  <!-- Symbol panel: every schematic symbol used in pool figures T-1, T-2, T-3.
       Idioms match the pool figures: zigzag resistors, cell-pair battery,
       dome lamp, brace connector, and the pool's ground style — a horizontal
       bar with three slanted strokes of decreasing length below it. -->

  <!-- ================= ROW 1 ================= -->

  <!-- Resistor -->
  <g transform="translate(55,55)">
    <polyline points="-34,0 -26,0 -22,-9 -14,9 -6,-9 2,9 10,-9 18,9 22,0 34,0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Resistor</text>
  </g>

  <!-- Variable resistor (rheostat) -->
  <g transform="translate(165,55)">
    <polyline points="-34,0 -26,0 -22,-9 -14,9 -6,-9 2,9 10,-9 18,9 22,0 34,0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <line x1="-16" y1="16" x2="12" y2="-10" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="12,-10 8,-2 4,-7" fill="currentColor" stroke="none"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">Variable resistor</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(rheostat)</text>
  </g>

  <!-- Capacitor -->
  <g transform="translate(275,55)">
    <line x1="-34" y1="0" x2="-4" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="4" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-4" y1="-11" x2="-4" y2="11" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="4" y1="-11" x2="4" y2="11" stroke="currentColor" stroke-width="3" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Capacitor</text>
  </g>

  <!-- Polarized capacitor -->
  <g transform="translate(385,55)">
    <line x1="-34" y1="0" x2="-4" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="4" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-4" y1="-11" x2="-4" y2="11" stroke="currentColor" stroke-width="3" fill="none"/>
    <path d="M 4,-11 Q 13,0 4,11" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">Capacitor</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(polarized)</text>
  </g>

  <!-- Variable capacitor -->
  <g transform="translate(495,55)">
    <line x1="-34" y1="0" x2="-4" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="4" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-4" y1="-11" x2="-4" y2="11" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="4" y1="-11" x2="4" y2="11" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="-15" y1="15" x2="15" y2="-15" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="15,-15 11,-7 7,-11" fill="currentColor" stroke="none"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">Capacitor</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(variable)</text>
  </g>

  <!-- Inductor -->
  <g transform="translate(605,55)">
    <line x1="-34" y1="0" x2="-26" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M -26,0 a 6.5,6.5 0 0 1 13,0 a 6.5,6.5 0 0 1 13,0 a 6.5,6.5 0 0 1 13,0 a 6.5,6.5 0 0 1 13,0" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="26" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Inductor</text>
  </g>

  <!-- Variable inductor (tapped) -->
  <g transform="translate(715,55)">
    <line x1="0" y1="-34" x2="0" y2="-26" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M 0,-26 a 6.5,6.5 0 0 0 0,13 a 6.5,6.5 0 0 0 0,13 a 6.5,6.5 0 0 0 0,13 a 6.5,6.5 0 0 0 0,13" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="0" y1="26" x2="0" y2="34" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="26" y1="0" x2="9" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="9,0 16,-4 16,4" fill="currentColor" stroke="none"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">Variable inductor</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(tapped)</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- Transformer (3-hump primary, core lines, 4-hump secondary) -->
  <g transform="translate(55,185)">
    <line x1="-16" y1="-34" x2="-16" y2="-19.5" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M -16,-19.5 a 6.5,6.5 0 0 0 0,13 a 6.5,6.5 0 0 0 0,13 a 6.5,6.5 0 0 0 0,13" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="-16" y1="19.5" x2="-16" y2="34" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-7" y1="-24" x2="-7" y2="24" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="7" y1="-24" x2="7" y2="24" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="16" y1="-34" x2="16" y2="-26" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M 16,-26 a 6.5,6.5 0 0 1 0,13 a 6.5,6.5 0 0 1 0,13 a 6.5,6.5 0 0 1 0,13 a 6.5,6.5 0 0 1 0,13" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="16" y1="26" x2="16" y2="34" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Transformer</text>
  </g>

  <!-- Diode -->
  <g transform="translate(165,185)">
    <line x1="-34" y1="0" x2="-10" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="-10,-9 -10,9 8,0" fill="currentColor" stroke="none"/>
    <line x1="8" y1="-10" x2="8" y2="10" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="8" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Diode</text>
  </g>

  <!-- LED -->
  <g transform="translate(275,185)">
    <line x1="-34" y1="0" x2="-10" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="-10,-9 -10,9 8,0" fill="currentColor" stroke="none"/>
    <line x1="8" y1="-10" x2="8" y2="10" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="8" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-9" y1="-12" x2="-2" y2="-21" stroke="currentColor" stroke-width="1.8" fill="none"/>
    <polygon points="-2,-21 -4,-14 -8,-17" fill="currentColor" stroke="none"/>
    <line x1="-2" y1="-10" x2="5" y2="-19" stroke="currentColor" stroke-width="1.8" fill="none"/>
    <polygon points="5,-19 3,-12 -1,-15" fill="currentColor" stroke="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">LED</text>
  </g>

  <!-- Zener diode -->
  <g transform="translate(385,185)">
    <line x1="-34" y1="0" x2="-10" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="-10,-9 -10,9 8,0" fill="currentColor" stroke="none"/>
    <line x1="8" y1="-10" x2="8" y2="10" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="8" y1="-10" x2="13" y2="-14" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="8" y1="10" x2="3" y2="14" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="8" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Zener diode</text>
  </g>

  <!-- NPN transistor -->
  <g transform="translate(495,185)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <line x1="-34" y1="0" x2="-10" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <rect x="-10" y="-11" width="4.5" height="22" fill="currentColor" stroke="none"/>
    <line x1="-6" y1="-9" x2="11" y2="-16" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="11" y1="-16" x2="11" y2="-34" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-6" y1="9" x2="11" y2="16" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="11,16 4,16 6,11" fill="currentColor" stroke="none"/>
    <line x1="11" y1="16" x2="11" y2="34" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">Transistor</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(NPN)</text>
  </g>

  <!-- Battery (two cell pairs: long, short, long, short) -->
  <g transform="translate(605,185)">
    <line x1="0" y1="-34" x2="0" y2="-17" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-15" y1="-17" x2="15" y2="-17" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="-7" y1="-9" x2="7" y2="-9" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="-15" y1="-1" x2="15" y2="-1" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="-7" y1="7" x2="7" y2="7" stroke="currentColor" stroke-width="3" fill="none"/>
    <line x1="0" y1="7" x2="0" y2="34" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Battery</text>
  </g>

  <!-- Ground (pool style: bar + three slanted strokes, longest first) -->
  <g transform="translate(715,185)">
    <line x1="0" y1="-34" x2="0" y2="-16" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-16" y1="-16" x2="16" y2="-16" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <line x1="-13" y1="2" x2="-7" y2="-12" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <line x1="-3" y1="5" x2="2" y2="-6" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <line x1="6" y1="8" x2="10" y2="0" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Ground</text>
  </g>

  <!-- ================= ROW 3 ================= -->

  <!-- SPST switch (drawn open, blade hinged at the left contact) -->
  <g transform="translate(55,315)">
    <line x1="-34" y1="0" x2="-21.5" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="-18" cy="0" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="18" cy="0" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="-18" y1="0" x2="13" y2="-12" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <line x1="21.5" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">Switch</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(SPST)</text>
  </g>

  <!-- Two-position switch (forked stubs, pool figure T-1 style) -->
  <g transform="translate(165,315)">
    <circle cx="8" cy="-14" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="8" cy="14" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="4.5" y1="-14" x2="-8" y2="-14" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="4.5" y1="14" x2="-8" y2="14" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-8" y1="-14" x2="-19" y2="-20" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-8" y1="-14" x2="-19" y2="-8" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-8" y1="14" x2="-19" y2="8" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="-8" y1="14" x2="-19" y2="20" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="11.5" y1="-14" x2="24" y2="-14" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="11.5" y1="14" x2="24" y2="14" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">Switch</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(two-position)</text>
  </g>

  <!-- Fuse -->
  <g transform="translate(275,315)">
    <line x1="-34" y1="0" x2="-12" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <rect x="-12" y="-6" width="24" height="12" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <line x1="12" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Fuse</text>
  </g>

  <!-- Lamp (dome on the wire) -->
  <g transform="translate(385,315)">
    <line x1="-34" y1="0" x2="-12" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M -12,0 A 12,12 0 0 1 12,0" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <line x1="12" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Lamp</text>
  </g>

  <!-- Connector (curly-brace coax symbol) -->
  <g transform="translate(495,315)">
    <line x1="-34" y1="0" x2="34" y2="0" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M 5,-16 Q -5,-16 -5,-8 Q -5,-1.5 -11,0 Q -5,1.5 -5,8 Q -5,16 5,16" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Connector</text>
  </g>

  <!-- Antenna (outline inverted triangle, apex down) -->
  <g transform="translate(605,315)">
    <polygon points="-16,-20 16,-20 0,8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="0" y1="-20" x2="0" y2="8" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <line x1="0" y1="8" x2="0" y2="34" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="12" fill="currentColor" text-anchor="middle">Antenna</text>
  </g>

  <!-- AC voltage source -->
  <g transform="translate(715,315)">
    <line x1="0" y1="-34" x2="0" y2="-16" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <rect x="-8" y="-7" width="16" height="4.5" fill="currentColor" stroke="none"/>
    <rect x="-8" y="2.5" width="16" height="4.5" fill="currentColor" stroke="none"/>
    <line x1="0" y1="16" x2="0" y2="34" stroke="currentColor" stroke-width="2" fill="none"/>
    <text x="0" y="58" font-size="11.5" fill="currentColor" text-anchor="middle">AC source</text>
    <text x="0" y="71" font-size="11.5" fill="currentColor" text-anchor="middle">(voltage)</text>
  </g>

</svg>
