<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="sans-serif">

  <!-- ===== Header: the definition (pool T3B02/T9A03) ===== -->
  <text x="380" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="currentColor">POLARIZATION = ORIENTATION OF THE ELECTRIC FIELD</text>

