  </g>

  <!-- ===== Panel A: line of sight ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="90" y1="430" x2="90" y2="340"/>
    <line x1="80" y1="430" x2="100" y2="430"/>
