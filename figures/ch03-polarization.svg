  <!-- ===== Labels ===== -->
  <g fill="currentColor" stroke="none">
    <text x="200" y="96" font-size="12.5">vertical antenna,</text>
    <text x="200" y="113" font-size="12.5">vertical E field</text>
    <text x="592" y="96" font-size="12.5">horizontal antenna,</text>
    <text x="592" y="113" font-size="12.5">horizontal E field</text>

    <text x="215" y="192" text-anchor="middle" font-size="13.5" font-weight="bold">LINE OF SIGHT (VHF/UHF)</text>
    <text x="575" y="192" text-anchor="middle" font-size="13.5" font-weight="bold">SKYWAVE (HF)</text>

    <text x="90" y="326" text-anchor="middle" font-size="11">TX vertical</text>
    <text x="195" y="330" text-anchor="middle" font-size="11.5">matching antennas</text>
    <text x="312" y="348" font-size="12.5" font-weight="bold">strong</text>
    <text x="170" y="393" text-anchor="middle" font-size="11.5">cross-polarized</text>
    <text x="340" y="406" font-size="12.5" font-weight="bold">weak</text>

    <text x="570" y="220" text-anchor="middle" font-size="10.5" letter-spacing="1.5">IONOSPHERE</text>
    <text x="445" y="326" text-anchor="middle" font-size="11">TX vertical</text>
    <text x="575" y="282" text-anchor="middle" font-size="10.5">polarization gets</text>
    <text x="575" y="296" text-anchor="middle" font-size="10.5">scrambled here</text>
    <text x="695" y="378" text-anchor="middle" font-size="12" font-weight="bold">either orientation</text>
    <text x="695" y="392" text-anchor="middle" font-size="12" font-weight="bold">works</text>

    <text x="380" y="478" text-anchor="middle" font-size="12.5">Line of sight: match the antennas. Sky wave: scrambling means either works.</text>
  </g>
</svg>
