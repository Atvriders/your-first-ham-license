# Series site: all three "Your First Ham License" books behind one nginx
# proxy, plus the landing page. Runnable today with just the Technician book:
#
#   docker compose -f series-docker-compose.yml up -d
#
# Browse http://localhost:8080/        -> landing page (series/index.html)
#        http://localhost:8080/tech/   -> the Technician book + audiobook
#
# Ports:
#   proxy                -> host :8080 (the only published port)
#   tech / general/extra -> container :80, internal only (the book images are
#                           nginx:alpine listening on 80; not host-published)
#
# General and Extra are placeholders until those books ship: their services
# sit behind the "future" profile (so `up` never pulls them) and their
# proxy blocks in series/nginx.conf are commented out. When a book ships:
# replace its image with the real GHCR repo, drop its "future" profile,
# uncomment its block in series/nginx.conf, and flip its flag in
# SERIES_BOOKS (tools/build_book.py).

services:
  tech:
    image: ghcr.io/atvriders/your-first-ham-license:latest
    restart: unless-stopped

  # TODO(until the General book ships): placeholder image slug.
  general:
    image: ghcr.io/atvriders/<general-slug>:latest
    profiles: ["future"]

  # TODO(until the Extra book ships): placeholder image slug.
  extra:
    image: ghcr.io/atvriders/<extra-slug>:latest
    profiles: ["future"]

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./series/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./series:/usr/share/nginx/html:ro
    depends_on:
      - tech
    restart: unless-stopped
